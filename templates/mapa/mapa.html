<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa - UrbanARTE</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #mapa { height: 70vh; width: 100%; border-radius: 12px; }
    .panel { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .panel input { padding: 8px; }
    .panel button { padding: 8px 14px; cursor: pointer; }
    .popup img { max-width: 160px; display: block; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="panel">
    <input id="publicacion" type="number" placeholder="ID de publicación">
    <input id="direccion" type="text" placeholder="Dirección aproximada (opcional)">
    <input id="lat" type="text" placeholder="Latitud" readonly>
    <input id="lng" type="text" placeholder="Longitud" readonly>
    <button id="guardar">Guardar ubicación</button>
    <span id="estado"></span>
  </div>

  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const mapa = L.map("mapa").setView([4.6097, -74.0817], 12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(mapa);

    const estado = document.getElementById("estado");
    let marcadorTemporal = null;

    mapa.on("click", (e) => {
      document.getElementById("lat").value = e.latlng.lat.toFixed(6);
      document.getElementById("lng").value = e.latlng.lng.toFixed(6);
      if (marcadorTemporal) marcadorTemporal.setLatLng(e.latlng);
      else marcadorTemporal = L.marker(e.latlng).addTo(mapa);
    });

    function agregarMarcador(u) {
      const pub = u.publicaciones || {};
      const usuario = (pub.usuarios || {}).nombre_usuario;
      const div = document.createElement("div");
      div.className = "popup";

      if (usuario) {
        const autor = document.createElement("strong");
        autor.textContent = usuario;
        div.append(autor);
      }
      if (pub.descripcion) {
        const desc = document.createElement("div");
        desc.textContent = pub.descripcion;
        div.append(desc);
      }
      if (u.direccion_aprox) {
        const dir = document.createElement("small");
        dir.textContent = u.direccion_aprox;
        div.append(dir);
      }
      if (pub.imagen && /^(https?:)?\//.test(pub.imagen)) {
        const img = document.createElement("img");
        img.src = pub.imagen;
        div.append(img);
      }
      L.marker([u.latitud, u.longitud]).addTo(mapa).bindPopup(div);
    }

    async function cargarUbicaciones() {
      const resp = await fetch("/api/ubicaciones");
      if (!resp.ok) { estado.textContent = "No se pudieron cargar las ubicaciones"; return; }
      (await resp.json()).forEach(agregarMarcador);
    }

    document.getElementById("guardar").addEventListener("click", async () => {
      const publicacion_id = document.getElementById("publicacion").value;
      const direccion_aprox = document.getElementById("direccion").value;
      const latitud = document.getElementById("lat").value;
      const longitud = document.getElementById("lng").value;

      if (!publicacion_id || !latitud || !longitud) {
        estado.textContent = "Escribe el ID de la publicación y haz clic en el mapa";
        return;
      }

      const resp = await fetch("/api/ubicaciones", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ publicacion_id, direccion_aprox, latitud, longitud })
      });

      if (resp.ok) {
        estado.textContent = "Ubicación guardada";
        if (marcadorTemporal) { mapa.removeLayer(marcadorTemporal); marcadorTemporal = null; }
        document.getElementById("lat").value = "";
        document.getElementById("lng").value = "";
        document.querySelectorAll(".leaflet-marker-icon").forEach(m => m.remove());
        cargarUbicaciones();
      } else {
        const err = await resp.json().catch(() => ({}));
        estado.textContent = err.error || "Error al guardar";
      }
    });

    cargarUbicaciones();
  </script>
</body>
</html>
