<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanARTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1 class="logo">UrbanARTE</h1>
    <p class="lema">el arte sale a la calle</p>
  </header>

  <section class="historias">
    {% for h in historias %}
      <div class="historia">
        <div class="anillo"><div>{{ h[0]|upper }}</div></div>
        {{ h }}
      </div>
    {% endfor %}
  </section>

  <main id="feed">
    {% include "_posts.html" %}
  </main>

  {% include "_nav.html" %}

  <script>
    // Actualiza las publicaciones cada 15 segundos sin recargar la página
    setInterval(async () => {
      try {
        const r = await fetch("/feed");
        if (r.ok) document.getElementById("feed").innerHTML = await r.text();
      } catch (e) {}
    }, 15000);
  </script>
</body>
</html>
