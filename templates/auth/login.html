<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · UrbanARTE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { background:#0f0f14; color:#f2f0ea; font-family:system-ui,sans-serif; margin:0; }
    .caja { max-width:380px; margin:60px auto; padding:0 16px; }
    h1 { color:#ffb703; font-style:italic; text-align:center; }
    form { display:flex; flex-direction:column; gap:12px; }
    input, button { padding:12px; font-size:1rem; border-radius:10px; border:1px solid #333; }
    input { background:#1b1b24; color:#f2f0ea; }
    button { background:#7b5cff; color:#fff; border:0; cursor:pointer; }
    .aviso { background:#2a1c24; border-left:4px solid #ff3d6e; padding:10px; border-radius:6px; }
    a { color:#ffb703; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>UrbanARTE</h1>
    <h2>Iniciar sesión</h2>
    {% for m in get_flashed_messages() %}<p class="aviso">{{ m }}</p>{% endfor %}
    <form method="post">
      <input name="correo" type="email" placeholder="Correo" required>
      <input name="contrasena" type="password" placeholder="Contraseña" required>
      <button>Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Crea una</a></p>
  </div>
</body>
</html>
