<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa · UrbanARTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1 class="logo">UrbanARTE</h1>
    <p class="lema">el mapa del arte urbano</p>
  </header>

  <main>
    <div id="mapa"></div>

    <form id="form-ubicacion" class="form-mapa">
      <p class="ayuda" id="ayuda">1. Elige una publicación · 2. Haz clic en el mapa · 3. Guarda</p>

      <select id="publicacion" required>
        <option value="">— Publicación sin ubicación —</option>
        {% for p in pendientes %}
          <option value="{{ p.id }}">{{ p.titulo }}</option>
        {% endfor %}
      </select>

      <input id="direccion" type="text" placeholder="Barrio o dirección aproximada (opcional)">
      <input id="coords" type="text" placeholder="Coordenadas: haz clic en el mapa" readonly>
      <button type="submit">Guardar ubicación</button>
    </form>
  </main>

  {% include "_nav.html" %}

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Subtareas 1 y 2: crear el mapa (centrado en Bogotá)
    const mapa = L.map("mapa").setView([4.711, -74.0721], 12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; Colaboradores de OpenStreetMap"
    }).addTo(mapa);

    function esc(t) {
      const d = document.createElement("div");
      d.textContent = t ?? "";
      return d.innerHTML;
    }

    // Subtareas 3 y 4: elegir ubicación con un clic y obtener las coordenadas
    let marcadorNuevo = null;
    let lat = null, lng = null;

    mapa.on("click", (e) => {
      lat = e.latlng.lat;
      lng = e.latlng.lng;
      if (marcadorNuevo) marcadorNuevo.setLatLng(e.latlng);
      else marcadorNuevo = L.marker(e.latlng).addTo(mapa);
      document.getElementById("coords").value = lat.toFixed(5) + ", " + lng.toFixed(5);
    });

    // Subtarea 5: guardar las coordenadas en la base de datos
    document.getElementById("form-ubicacion").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const ayuda = document.getElementById("ayuda");
      if (lat === null) { ayuda.textContent = "Primero haz clic en el mapa 📍"; return; }

      const r = await fetch("/api/ubicaciones", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          publicacion_id: Number(document.getElementById("publicacion").value),
          direccion_aprox: document.getElementById("direccion").value || null,
          latitud: lat,
          longitud: lng
        })
      });
      const datos = await r.json();
      if (datos.ok) location.reload();
      else ayuda.textContent = "No se pudo guardar: " + (datos.error || "error");
    });

    // Subtarea 6: mostrar en el mapa las ubicaciones guardadas
    fetch("/api/ubicaciones").then(r => r.json()).then(lista => {
      lista.forEach(u => {
        const pub = u.publicaciones || {};
        const autor = (pub.usuarios || {}).nombre_usuario || "anónimo";
        const foto = pub.imagen ? `<img src="${esc(pub.imagen)}" style="width:160px;border-radius:6px;display:block;margin-bottom:6px">` : "";
        L.marker([u.latitud, u.longitud]).addTo(mapa).bindPopup(
          `${foto}<strong>${esc(autor)}</strong><br>${esc(pub.descripcion)}<br><small>📍 ${esc(u.direccion_aprox)}</small>`
        );
      });
    });
  </script>
</body>
</html>
